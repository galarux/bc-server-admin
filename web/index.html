<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>BC Server Admin</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/i18n.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a class="brand-company" href="https://galarux.com" target="_blank" rel="noopener noreferrer" title="galarux.com">
        <img src="img/galarux-logo-white.png" alt="Galarux" width="70" height="22">
      </a>
      <span class="brand-sep" aria-hidden="true"></span>
      <span class="brand-product">
        <img src="favicon.svg" alt="" width="20" height="20">
        <span>BC Server Admin</span>
      </span>
    </div>
    <div class="host" id="hostInfo"></div>
    <div class="spacer"></div>
    <nav class="top-actions">
      <button type="button" class="btn btn-top" id="btnInstances" data-i18n="navInstances"></button>
      <button type="button" class="btn btn-top" id="btnCompare" data-i18n="navCompare"></button>
      <select id="langSelect" class="top-select" aria-label="Language">
        <option value="es">ES</option>
        <option value="en">EN</option>
      </select>
      <button type="button" class="btn btn-top btn-icon" id="btnTheme" data-i18n-title="toggleTheme">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 18V4a8 8 0 0 1 0 16Z"/></svg>
      </button>
      <button type="button" class="btn btn-top btn-close" id="btnShutdown" data-i18n="shutdown"></button>
    </nav>
  </header>

  <div id="banners"></div>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-head">
        <span data-i18n="instances"></span>
        <button type="button" class="btn btn-ghost btn-icon" id="btnRefresh" data-i18n-title="refresh">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35Z"/></svg>
        </button>
      </div>
      <input type="search" id="instanceFilter" class="input" data-i18n-placeholder="filterInstances">
      <ul id="instanceList" class="instance-list"></ul>
      <div class="sidebar-foot" id="sidebarFoot"></div>
    </aside>
    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <dialog id="dialog" class="dialog"></dialog>
</body>
</html>
